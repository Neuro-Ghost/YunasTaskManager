<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Dancing+Script&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Quicksand:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/homeStyle.css">
  <link rel="icon" type="image/jpg" href="https://i.pinimg.com/564x/e8/df/01/e8df017b8459c3fdc951da06ce0be115.jpg">
  <title>Welcome</title>
  
  <style>
    /* 4-Box PIN Layout Matching Screenshots */
    .pin-boxes {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
      cursor: pointer;
    }

    .pin-box {
      width: 48px;
      height: 56px;
      background: #ffffff;
      border: 1.5px solid #dcdcdc;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 600;
      color: #333333;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      position: relative;
      transition: border 0.15s ease, box-shadow 0.15s ease;
    }

    /* Active Focused Box Style (Double Outline Ring + Blinking Cursor) */
    .pin-box.focused {
      border: 2px solid #111111;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
    }

    .pin-box.focused::after {
      content: "";
      width: 1.5px;
      height: 24px;
      background-color: #111111;
      animation: blink 1s infinite;
      position: absolute;
    }

    /* Hide cursor line when box contains a filled digit */
    .pin-box.filled::after {
      display: none;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Visually hide original input element while preserving JS functionality */
    #secretMessage {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <audio id="bg-audio" autoplay loop>
    <source src="rain.mp3" type="audio/mpeg">
  </audio>

  <div id="loading-overlay">
    <div class="loader"><img src="loading.gif" alt="Loading..."></div>
  </div>

  <div class="home-container">
    <div class="prompt-container">
      <h1>Enter the 4-digit access code</h1>
      
      <!-- 4 Rounded PIN Boxes -->
      <div class="pin-boxes" id="pinBoxes" onclick="focusInput()">
        <div class="pin-box" id="box-0"></div>
        <div class="pin-box" id="box-1"></div>
        <div class="pin-box" id="box-2"></div>
        <div class="pin-box" id="box-3"></div>
      </div>

      <!-- Hidden underlying functional input -->
      <input 
        type="text" 
        id="secretMessage" 
        maxlength="4" 
        inputmode="numeric" 
        pattern="[0-9]*" 
        autocomplete="off"
      />
      <button onclick="checkSecret()">Get In!</button>
    </div>
  </div>

  <div class="video-container-home">
    <video id="background-video-home" autoplay muted loop class="background-video-home" preload="auto">
      <source src="assets/newBG.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>

  <script>
    const secretInput = document.getElementById('secretMessage');
    const boxes = [
      document.getElementById('box-0'),
      document.getElementById('box-1'),
      document.getElementById('box-2'),
      document.getElementById('box-3')
    ];

    function focusInput() {
      secretInput.focus();
      updateBoxes();
    }

    function updateBoxes() {
      const value = secretInput.value;
      const activeIndex = Math.min(value.length, 3);
      const isFocused = document.activeElement === secretInput;

      boxes.forEach((box, index) => {
        // Handle digit display
        if (index < value.length) {
          box.textContent = value[index];
          box.classList.add('filled');
        } else {
          box.textContent = '';
          box.classList.remove('filled');
        }

        // Handle focused box indicator
        if (isFocused && index === activeIndex) {
          box.classList.add('focused');
        } else {
          box.classList.remove('focused');
        }
      });
    }

    // Restrict strictly to digits (0-9)
    secretInput.addEventListener('input', () => {
      secretInput.value = secretInput.value.replace(/[^0-9]/g, '');
      if (secretInput.value.length > 4) {
        secretInput.value = secretInput.value.slice(0, 4);
      }
      updateBoxes();
    });

    secretInput.addEventListener('focus', updateBoxes);
    secretInput.addEventListener('blur', updateBoxes);

    // Initial state setup
    updateBoxes();
  </script>

  <!-- External module (moved from inline) -->
  <script type="module" src="js/home.js"></script>
</body>
</html>
