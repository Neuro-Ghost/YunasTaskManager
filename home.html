<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Dancing+Script&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Quicksand:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/homeStyle.css">
  <link rel="icon" type="image/jpg" href="https://i.pinimg.com/564x/e8/df/01/e8df017b8459c3fdc951da06ce0be115.jpg">
  <title>Welcome</title>
  
  <style>
    /* 4-Digit Indicator Display */
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 20px 0;
      cursor: pointer;
    }

    .pin-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.6);
      background: transparent;
      transition: all 0.2s ease;
    }

    .pin-dot.filled {
      background: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    /* Completely hide the text input while keeping it functional */
    #secretMessage {
      position: absolute;
      opacity: 0;
      pointer-events: auto;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <audio id="bg-audio" autoplay loop>
    <source src="rain.mp3" type="audio/mpeg">
  </audio>

  <div id="loading-overlay">
    <div class="loader"><img src="loading.gif" alt="Loading..."></div>
  </div>

  <div class="home-container">
    <div class="prompt-container">
      <h1>4 digits</h1>
      
      <!-- Only the 4 Circles are visible -->
      <div class="pin-dots" id="pinDots" onclick="document.getElementById('secretMessage').focus()">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>

      <!-- Hidden functional input -->
      <input 
        type="text" 
        id="secretMessage" 
        maxlength="4" 
        inputmode="numeric" 
        pattern="[0-9]*" 
        autocomplete="off"
      />
      <button onclick="checkSecret()">Get In!</button>
    </div>
  </div>

  <div class="video-container-home">
    <video id="background-video-home" autoplay muted loop class="background-video-home" preload="auto">
      <source src="assets/newBG.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>

  <script>
    const secretInput = document.getElementById('secretMessage');
    const dots = document.querySelectorAll('.pin-dot');

    function updateDots() {
      const length = secretInput.value.length;
      dots.forEach((dot, index) => {
        if (index < length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      });
    }

    // Filter input strictly for digits (0-9)
    secretInput.addEventListener('input', () => {
      secretInput.value = secretInput.value.replace(/[^0-9]/g, '');

      if (secretInput.value.length > 4) {
        secretInput.value = secretInput.value.slice(0, 4);
      }
      
      updateDots();
    });

    // Block non-digit keys at keydown
    secretInput.addEventListener('keydown', (e) => {
      const allowedKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'];
      if (!allowedKeys.includes(e.key) && !/^[0-9]$/.test(e.key)) {
        e.preventDefault();
      }
    });

    updateDots();
  </script>

  <!-- External module (moved from inline) -->
  <script type="module" src="js/home.js"></script>
</body>
</html>
